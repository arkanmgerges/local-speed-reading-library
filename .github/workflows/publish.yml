name: publish

# Builds every publishable edition from its pinned source, uploads the assets
# that are not on the CDN yet (immutable, never overwritten) and then publishes
# the catalogue. Secrets: see docs/publishing.md.

on:
  push:
    branches: [main]
    paths:
      - 'metadata/**'
      - 'catalog/**'
      - 'sources/**'
      - 'tools/**'
      - 'scripts/**'
      - '.github/workflows/publish.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      BOOKS_BASE_URL: ${{ vars.BOOKS_BASE_URL || 'https://books.localspeedreading.com/' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Check that the R2 secrets are configured
        id: secrets
        run: |
          if [ -z "$R2_ACCESS_KEY_ID" ] || [ -z "$R2_SECRET_ACCESS_KEY" ] || [ -z "$R2_ACCOUNT_ID" ] || [ -z "$R2_BUCKET" ]; then
            echo "R2 secrets are not configured; validating only." >&2
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - run: dart pub get
        working-directory: tools
      - name: Validate
        run: dart run bin/lsr.dart validate
        working-directory: tools
      - name: Editions whose metadata changed in this push
        id: changed
        run: |
          before="${{ github.event.before }}"
          if [ "${{ github.event_name }}" = "push" ] && [ -n "$before" ] && git cat-file -e "$before" 2>/dev/null; then
            ids=""
            for f in $(git diff --name-only "$before" "${{ github.sha }}" -- metadata | grep '\.json$'); do
              [ -f "$f" ] && ids="$ids $(basename "$f" .json)"
            done
            echo "ids=$ids" >> "$GITHUB_OUTPUT"
            echo "changed:$ids"
          else
            echo "ids=--all" >> "$GITHUB_OUTPUT"
            echo "no base commit; rebuilding everything"
          fi
      - name: Rebuild the changed editions from their pinned sources
        if: steps.changed.outputs.ids != ''
        run: dart run bin/lsr.dart build --check --delay 1 ${{ steps.changed.outputs.ids }}
        working-directory: tools
      - name: Compare with the CDN (refuses to overwrite an immutable asset)
        if: steps.secrets.outputs.configured == 'true'
        run: dart run bin/lsr.dart publish-check --base-url "$BOOKS_BASE_URL" --plan ../build/upload-plan.json
        working-directory: tools
      - name: Upload missing assets, then the catalogue
        if: steps.secrets.outputs.configured == 'true'
        run: scripts/upload.sh
      - name: Verify the deployment
        if: steps.secrets.outputs.configured == 'true'
        run: dart run bin/lsr.dart publish-check --base-url "$BOOKS_BASE_URL"
        working-directory: tools
